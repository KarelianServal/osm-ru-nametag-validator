[build-system]
requires = [ "setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-ru-nametag-validator"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [ "pymorphy3>=2.0",
                 "requests>=2.31",
                 "geopandas>=1.0",
                 "pandas>=2.0",
                 "shapely>=2.0" ]
# readme = "README.org"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/KarelianServal/OSM-ru-nametag-validator"
Issues = "https://github.com/KarelianServal/OSM-ru-nametag-validator/issues"

[project.scripts]
lakes-nametag-validator = "osm_ru_nametag_validator.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=2.4.0",
]

[tool.setuptools.packages.find]
include = [ "osm_ru_nametag_validator*" ]

[dependency-groups]
dev = ["pytest>=8", "mypy>=2.4.0"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts = "-ra"

[tool.mypy]
strict = true   
ignore_missing_imports = true
