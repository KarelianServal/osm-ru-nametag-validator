<extend template="base.shtml">
    <head id="head">
        <style>
        </style>
    </head>
    <body id="body">
        <h1 :text="$page.title"></h1>
        <div class="content" :html="$page.content()"></div>

        <table class="invalid-lakes-table">
            <thead>
                <tr id="tables-first-row">
                    <th>Type</th>
                    <th>ID</th>
                    <th>Tег 'name='</th>
                    <th>Регион</th>
                    <th>Широта</th>
                    <th>Долгота</th>
                </tr>
            </thead>
            <!-- Parse the JSON file and loop over the resulting array -->
            <tr :loop="$site.asset($page.custom.get('valid_data')).ziggy()">
                <tr>
                    <td :text="$loop.it.getOr('@type', 'N/A')"></td>
                    <td :text="$loop.it.getOr('@id', 'N/A')"></td>
                    <td :text="$loop.it.getOr('name', 'Unnamed')"></td>
                    <td :text="$loop.it.getOr('region', 'Unknown')"></td>
                    <td :text="$loop.it.getOr('@lat', 'N/A')"></td>
                    <td :text="$loop.it.getOr('@lon', 'N/A')"></td>
                </tr>
            </tr>
        </table>

    </body>
