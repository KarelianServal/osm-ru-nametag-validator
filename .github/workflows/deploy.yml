name: Deploy zine pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy .
    
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install validator
        run: pip install -e .

      - name: Pick cache keys
        id: date
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "hour=$(date -u +%Y-%m-%d-%H)" >> "$GITHUB_OUTPUT"

      - name: Restore cached regions geojson
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v5
        with:
          path: data/ru-regions.geojson
          key: overpass-${{ steps.date.outputs.month }}

      - name: Restore cached lakes names
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v5
        with:
          path: data/ru-lakes.csv
          key: overpass-${{ steps.date.outputs.hour }}

      - name: Run validator
        env:
          OVERPASS_API: ${{ secrets.OVERPASS_API }}
        run: >-
          lakes-nametag-validator
          --json
          --out-dir zine/assets/out
          --api "$OVERPASS_API"

      - name: Generate .smd pages
        working-directory: zine
        run: bash generate-smd-pages.sh

      # - name: Setup Zine
      #   uses: kristoff-it/setup-zine@v2
      #   run: zine release

      # This is required since 'uses:' ignores 'working-directory'
      - name: Install Zine
        run: |
          VERSION=$(sed -n 's/.*\.zine_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' zine/zine.ziggy)
          wget -q -O /tmp/zine.tar.xz \
            "https://github.com/kristoff-it/zine/releases/download/v${VERSION}/x86_64-linux-musl.tar.xz"
          mkdir -p /tmp/zine && tar xJf /tmp/zine.tar.xz -C /tmp/zine
          echo "/tmp/zine" >> "$GITHUB_PATH"

      - name: Build site
        working-directory: zine
        run: zine release

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5
        with:
          path: zine/public

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1
